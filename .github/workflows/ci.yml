name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 纯文档改动不值得跑一轮四平台矩阵（打 tag 时不受此限制）。
    # source-drift.yml 也排除：它只是那条探针的排程，改它不需要重新编译五个平台。
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/source-drift.yml"
  pull_request:
  workflow_dispatch:

env:
  CLI: npx --yes @tauri-apps/cli@2
  APP: codex-reset-reminder

# 统一用 bash：Windows 默认 pwsh 会把 `@tauri-apps/cli@2` 当成 splatting 语法解析。
defaults:
  run:
    shell: bash

jobs:
  # 便宜的编译与逻辑门：任何 Rust API 名字写错，都先在这里暴露，而不是烧掉四平台矩阵。
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      # tauri::generate_context! 在**编译期**就检查 frontendDist 是否存在，
      # 换成需要构建的前端之后，cargo 也得先有 dist —— 否则宏 panic 成
      # "The `frontendDist` configuration is set to `\"../dist\"` but this path doesn't exist"，
      # 看起来像 Rust 坏了，其实是缺产物（run 38578108239 就是这么红的）。
      - name: 构建前端产物（供宏嵌入）
        # working-directory 必须是仓库根：这个 job 的默认目录是 src-tauri，
        # 而 vite.config.ts 现在以 cwd 为锚算路径。
        working-directory: .
        run: npm install --no-audit --no-fund && npm run build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: 格式检查
        run: cargo fmt --all --check
      - name: 单元测试（夹具来自真实线上数据）
        run: cargo test --locked
      - name: 重试包装器的分支自测（纯 shell，不起 WebView）
        # 目的：ios 那步的重试只有在真抖起来时才走到，所以把它的三条分支在这里每次都跑一遍
        # （成功不打噪声 / 抖一次后成功且恰好尝试 2 次 / 一直失败恰好 2 次并 rc=1 / 参数不足 rc=2）。
        # 变异测试过：把 -ge \$max 改成 -ge 1、或把用法错误改成 exit 0，这个自测都会红。
        # working-directory 要显式给仓库根：这个 job 的默认目录是 src-tauri（cargo 在那儿跑），
        # 第一版没写，CI 直接 127 "scripts/test-with-retry.sh: No such file or directory"（run 38281962525）。
        working-directory: .
        run: bash scripts/test-with-retry.sh

  # 前端编译门：Vite/TS 的错误要在这里几十秒内暴露，而不是烧掉一轮三平台矩阵。
  # 产物要按输出来验，不看退出码 —— 打包器完全可能"成功"地产出一个空目录。
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: 锁审计（"有节点却没版本号"会让 npm ci 在解析阶段就崩）
        # 这里原来写的是"断言 npm >= 11"，那是错的诊断：换成 node 24 + npm 11 之后仍然红，
        # 真因是 npm 给 rolldown 的平台绑定写出了没有 version 字段的条目 —— 于是构建链退回 Vite 7，
        # 并留下这条脚本化审计（本机 win32 的 npm ci --dry-run 过得去，只有 linux 才炸，
        # 所以必须有一条不用平台就能验的检查）。
        run: |
          node scripts/check-lock.mjs
          echo "npm $(npm --version) / node $(node --version)"
      - name: 按锁文件装依赖（与 cargo test --locked 同一条纪律）
        run: npm install --no-audit --no-fund
      - name: 类型检查（不产出文件，只报错）
        run: npm run typecheck
      - name: 构建
        run: npm run build
      - name: 核对产物真的存在
        run: |
          set -euo pipefail
          test -f dist/index.html
          n=$(find dist -type f | wc -l)
          [ "$n" -ge 3 ] || { echo "dist 只有 $n 个文件，八成是空跑"; exit 1; }
          grep -qE '<script[^>]*type="module"' dist/index.html || { echo "index.html 里没有模块入口"; exit 1; }
          echo "PASS dist：$n 个文件，$(du -sk dist | cut -f1) KB；js=$(find dist -name '*.js' | wc -l) css=$(find dist -name '*.css' | wc -l)"

  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 线上数据源探针
        run: node scripts/probe-sources.mjs

  desktop:
    needs: [check, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis,msi
          - name: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
          - name: macos
            os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      # tauri build 会先跑 build.beforeBuildCommand（= npm run build），
      # 所以这条车道必须有 node_modules，否则 npm 在 CI 上直接 127。
      - name: 装前端依赖
        run: npm install --no-audit --no-fund
      - name: 构建桌面安装包
        run: ${{ env.CLI }} build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.APP }}-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

  android:
    needs: [check, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 确认或安装 Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME 未设置，安装 cmdline-tools"
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          ls "${ANDROID_HOME:-/none}/platforms" 2>/dev/null || true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: 确认 NDK（Rust 链接 Android 目标必需）
        run: |
          found=""
          for v in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_LATEST_HOME:-}" "${NDK_HOME:-}"; do
            [ -n "$v" ] && [ -d "$v" ] && found="$v" && break
          done
          if [ -z "$found" ]; then
            echo "runner 上没有 NDK，用 sdkmanager 安装"
            sdkmanager "ndk;27.2.12479018" >/dev/null 2>&1 || sdkmanager "ndk;26.1.10909125"
            found="${ANDROID_HOME:-$HOME/android-sdk}/ndk"
            found=$(ls -d "$found"/* | head -1)
          fi
          echo "NDK_HOME=$found" >> "$GITHUB_ENV"
          echo "使用 NDK: $found"
      - name: 添加 Android Rust 目标
        run: rustup target add aarch64-linux-android
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 安装前端依赖与 tauri CLI
        # Tauri 生成的 gradle 里 rustBuild<Abi> 任务会执行 `npm run tauri`，
        # 所以安卓车道必须有本地 CLI，不能像桌面那样只用 npx。
        # 为什么不是 npm ci：实测（run 38580778808）npm 11 在 --package-lock-only 下只把**当前平台**
        # 的可选二进制写进锁，linux 上 npm ci 直接 EUSAGE 缺 11 条 @tauri-apps/cli-* 绑定。
        # 平台二进制按平台解是这类包的常态；锁的价值在钉住 JS 依赖树（react/vite/tailwind…），
        # 所以这里用 npm install，锁的完整性另由 scripts/check-lock.mjs 在 web 车道审计。
        run: npm install --no-audit --no-fund
      - name: 确认 npm run tauri 可用
        run: npm run tauri -- --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: 生成 Android 工程
        run: ${{ env.CLI }} android init --ci
      - name: 补 POST_NOTIFICATIONS（模板里只有 INTERNET，Android 13+ 缺它通知会静默丢弃）
        working-directory: src-tauri/gen/android
        run: |
          MANIFEST=app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          fi
          grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST" || { echo "权限未写入，终止"; exit 1; }
          echo "--- 注入后的权限声明 ---"
          grep -n "uses-permission" "$MANIFEST"
      - name: 构建 debug APK（可直接侧载）
        run: ${{ env.CLI }} android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.APP }}-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # iOS 只在打标签或手动触发时构建：需要 macOS  runner，且真机签名依赖 Apple 账号。
  ios:
    needs: [check, web]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      # 换成 Vite 之后 `tauri ios build` 会先跑 beforeBuildCommand（npm run build），
      # 这条车道原先连 node_modules 都没有 —— 桌面能过是因为那时前端是静态目录、不需要构建。
      - name: 装前端依赖
        run: npm install --no-audit --no-fund
      - name: 添加 iOS Rust 目标
        run: rustup target add aarch64-apple-ios-sim aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: 生成 iOS 工程
        run: ${{ env.CLI }} ios init --ci
      - name: 构建未签名 ipa（供 SideStore/AltStore 用免费 Apple ID 重签）
        # 这一步会临时从 GitHub 取 SwiftPM 依赖（Brendonovich/swift-rs）。run 38279394332（2026-10-12）
        # 就是这么红的：runner 缓存目录不存在 → Failed to compile swift package Tauri → xcodebuild 65。
        # 同一棵树的 v0.1.0 出过 ipa，所以是抓取抖动不是代码坏；最多试 3 次（间隔 20 s）。
        # 循环本体在 scripts/with-retry.sh，由 check 作业里的 test-with-retry.sh 每次构建都验一遍
        # —— 写在 YAML 里的重试永远测不到，而没测过的重试等于没有。
        # 仍然失败就如实变红；且 release 不靠 ios（条件是 always() + desktop/android 成功）。
        run: bash scripts/with-retry.sh 3 20 ${{ env.CLI }} ios build --no-sign
      - name: 收集 ipa
        run: |
          IPA=$(find src-tauri/gen/apple -name '*.ipa' | head -1)
          echo "ipa=$IPA"
          test -n "$IPA"
          mkdir -p out
          cp "$IPA" out/
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.APP }}-ios-unsigned
          path: out/*.ipa
          if-no-files-found: error

  release:
    # 等 ios 车道，但不被它卡住：ipa 是加分项，桌面包与 apk 成功就该出 Release。
    needs: [desktop, android, ios]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.desktop.result == 'success' &&
      needs.android.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/**
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          make_latest: "true"
