name: source-drift

# 每天检查两个第三方数据源是否还长这样；结构变了就红，不用等应用弹窗失灵才发现。
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: 数据源结构探针
        run: node scripts/probe-sources.mjs
      - name: 镜像健康检查（cron 停了要在这里变红，而不是让 App 一直显示"没有新重置"）
        run: node scripts/check-mirror.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-report
          path: probe-report.json
