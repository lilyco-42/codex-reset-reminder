name: source-drift

# 每天检查两个第三方数据源是否还长这样；结构变了就红，不用等应用弹窗失灵才发现。
#
# 为什么一天四次而不是一次（实测）：这个账号的 schedule 会推迟 1–3 小时，而且**有些槽位整槽不跑**。
# 观测记录：10-11 那条 08:23 的 cron 到 14:57 才落地；10-12 的 18:23 槽在 21:19:17Z 落地，
# 而同一天 12:23 的槽位到过期后没有任何 run。所以多槽位能提高"今天至少验过一次"的概率，但不是保证。
#
# 真正兜住"镜像悄悄停了"的不是这条 CI，而是两层在线机制：
#   1) Worker 自己的 cron 每 10 分钟重写 data.json，/health 由它算时效，超 6 小时返回 500；
#   2) App 读到的镜像若超过 6 小时没更新，就判定镜像不可信并自动退回直连，状态栏说明原因。
# 这条探针的作用是"我这边主动报警 + 顺带核对结构没变"，不是唯一防线。
on:
  schedule:
    - cron: "23 */6 * * *"
  # 再叠一条完全不依赖定时器的触发：每次 main 的 ci 跑完都探一遍。
  # 加它的原因不是"cron 坏了"（那个判断我测得太早，后来 cron 确实落地了，只是推迟约 3 小时），
  # 而是"整槽会丢"加上本仓没有每天必跑的工作流可搭桥（ops 仓那种 workflow_run 挂法在这里用不上）——
  # 有提交就必然验一次，把"最近有没有验过"从单个定时器手里拿走。
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: 数据源结构探针
        run: node scripts/probe-sources.mjs
      - name: 镜像健康检查（cron 停了要在这里变红，而不是让 App 一直显示"没有新重置"）
        run: node scripts/check-mirror.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-report
          path: probe-report.json
