name: source-drift

# 每天检查两个第三方数据源是否还长这样；结构变了就红，不用等应用弹窗失灵才发现。
#
# 为什么一天四次而不是一次（实测，不是猜）：这个账号的 GitHub schedule 会被整小时地推迟，
# 甚至直接漏掉。2026-10-11 那条 08:23 的 cron 到 14:57 才落地；2026-10-12 当天这个仓库
# 一个 run 都没有（event=schedule 全历史只有 1 条）。同账号另一个仓库 02:22 的 cron 09:26 才跑。
# 一天四次是把"至少一次落地"变成大概率事件，不是保证。
#
# 真正兜住"镜像悄悄停了"的不是这条 CI，而是两层在线机制：
#   1) Worker 自己的 cron 每 10 分钟重写 data.json，/health 由它算时效，超 6 小时返回 500；
#   2) App 读到的镜像若超过 6 小时没更新，就判定镜像不可信并自动退回直连，状态栏说明原因。
# 这条探针的作用是"我这边主动报警 + 顺带核对结构没变"，不是唯一防线。
on:
  schedule:
    - cron: "23 */6 * * *"
  # 加一条不依赖 GitHub 定时器的触发：每次 main 的 ci 跑完都顺手探一遍。
  # 为什么要加：一天四次这个改法已被实测否证 —— 12:23 UTC 的槽位过期后本仓 0 个 run
  # （ops 仓同时段也是 0），而同账号唯一确定会落地的是另一条 02:22 的 cron（推迟约 7 小时）。
  # 那条评论里的搭桥（workflow_run 挂到实测会跑的车道）只能在 ops 仓做，本仓没有每天落地的
  # 定时工作流可搭，所以退一步：至少保证"有提交就必然探一次"，空闲期靠 Worker /health + App 的
  # 6 小时退回直连这两层在线机制兜底。
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: 数据源结构探针
        run: node scripts/probe-sources.mjs
      - name: 镜像健康检查（cron 停了要在这里变红，而不是让 App 一直显示"没有新重置"）
        run: node scripts/check-mirror.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-report
          path: probe-report.json
